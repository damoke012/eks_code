# ==============================================================================
# op-usxpress-prod — Flux infra wiring.  INFRA-1589.
#
# SELF-CONTAINED BY DESIGN. op-prod owns every resource it depends on:
#   * Secrets Manager  op-usxpress-prod/*            (account 937464026810)
#   * S3               etcd-snapshots-op-usxpress-prod, velero-op-usxpress-prod
#   * IRSA roles       op-usxpress-prod-<workload>   (own OIDC provider)
#   * Route53          usxpress-prod.com, txtOwnerId iaac-talos/us-east-2/op-usxpress-prod
# No cross-cluster bridge, no dependency on dev/QA accounts, buckets or secrets.
# The ONE deliberate exception is the shared ECR registry 064859874041, which is
# central for every cluster (see ecr-credentials/cronjob.yaml).
#
# NOT PHASED — every Kustomization is active. Flux's dependsOn graph handles
# ordering, and anything AWS-touching simply retries until IRSA is up, then goes
# Ready on its own. A commented "phase 2" appendix would require a human to come
# back and uncomment it, which is precisely the manual step we are removing.
#
# cross-cluster-eso is intentionally ABSENT — retired (qa-tier2-additions.yaml).
# It is what required the manual "Seed Cross-Cluster ESO Token" Octopus runbook
# in the QA bootstrap checklist (Phase 7/8). Prod never adopts it.
#
# RisingWave: deliberately absent — ./manifests/op-usxpress-prod does not exist
# in iaac-risingwave-onprem yet; wiring it = the 17-day "path not found" failure.
# ==============================================================================

