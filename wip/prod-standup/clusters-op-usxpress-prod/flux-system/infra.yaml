# --------------------------------------------------------------- argocd ----
# Split deliberately: on a greenfield cluster the argoproj.io CRDs do not exist
# until the chart installs, so AppProjects must apply AFTER it. `wait: true` on
# `argocd` makes the HelmRelease Ready (= CRDs present) gate `argocd-config`.
# argocd-config's admin ExternalSecret reads op-usxpress-prod/platform/argocd —
# that SM secret must hold a REAL value. A PLACEHOLDER syncs GREEN and leaves
# Argo CD with an unusable credential.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: infra
  path: ./infrastructure/argocd
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: infra
  path: ./infrastructure/argocd-config
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: argocd
    - name: external-secrets
