{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "usxpress-app.serviceAccountName" . }}
  labels: {{- include "usxpress-app.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.roleArn }}
    # The pod-identity webhook reads this and injects AWS_ROLE_ARN plus the
    # projected SA token.
    #
    # ⚠️ That webhook's failurePolicy is Ignore. If it is unavailable when the
    # pod is created, the pod starts with NO AWS credentials, no event, no
    # error -- and keeps running. A RisingWave compactor did exactly that for
    # 88 days while dev's object store was dead and every status was green.
    # Prove the identity from inside a running pod; do not infer it from here.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
{{- end }}
