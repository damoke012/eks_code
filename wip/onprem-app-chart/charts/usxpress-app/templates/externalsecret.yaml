{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "usxpress-app.fullname" . }}-secrets
  labels: {{- include "usxpress-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "usxpress-app.fullname" . }}-secrets
    creationPolicy: Owner
  data:
  {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
  {{- end }}
{{- end }}
# ⚠️ SecretSynced is a statement about the SYNC, not about the value. ESO
# writes the keys it could resolve even when others fail, so the Secret exists,
# the ExternalSecret looks green, and the pod dies at container creation with
# RESTARTS 0 -- invisible to every restart-based alert. Read the value.
