# Every on-prem application delivered by Argo CD on this cluster.
#
# Onboarding an app is four lines in `elements` below — not a new file, not a new
# Kustomization. The ApplicationSet controller (already part of the Argo CD stack)
# generates one Application per entry.
#
# The `apps` AppProject restricts destinations to `app-*`, so nothing added here
# can target a platform namespace even by mistake.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: onprem-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          # ---- onboard here -------------------------------------------------
          - name: risingwave-etl
            namespace: app-risingwave
            # ssh://, NOT https://. The credential is a deploy key, secret-type
            # repository, bound to this EXACT url. An https:// element does not
            # match it, gets no credential, and GitHub answers an unauthenticated
            # request for a private repo with "Repository not found" -- which
            # reads like a deleted repo, not an auth failure.
            #
            # This file said https:// while the branch said ssh://, and PR #100
            # copied this file over the branch and reverted it, breaking delivery
            # about an hour after it was proven working. Verify with
            # scripts/check-argocd-repo-credentials.sh before shipping a change
            # to this file.
            repoURL: ssh://git@github.com/variant-inc/risingwave-pipeline.git
            path: deploy/overlays/qa
          # -------------------------------------------------------------------
  template:
    metadata:
      name: '{{.name}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      source:
        repoURL: '{{.repoURL}}'
        # The repository's ACTUAL default branch. `risingwave-pipeline` is
        # `master`; several variant-inc repos are. A wrong revision fails BEFORE
        # authentication, which masked the missing Git credential (INFRA-1647)
        # for a full day. Corrected on the cluster by platform#96.
        targetRevision: master
        path: '{{.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # INFRA-1653. Argo CD's default is five automatic retries, and with a Sync
        # hook each retry recreates the hook Job -- destroying the previous
        # attempt's pod and its logs. On 2026-08-20 that took three separate
        # attempts to read one failure, and on final failure the Job was removed
        # entirely. One retry, then stop: the failure persists until someone
        # deliberately re-syncs, which is when they are ready to read it.
        retry:
          limit: 1
          backoff:
            duration: 30s
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=false     # the platform owns app-* namespaces
