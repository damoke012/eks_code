---
# INFRA-1647 — FALLBACK VARIANT. Use this ONLY if a GitHub App cannot be created
# on the variant-inc org. Everything else is identical to
# repo-creds-externalsecret.yaml; apply exactly one of the two, never both.
#
# The cost of this variant is an expiry date. A PAT dies silently: Argo CD keeps
# serving the last successful comparison and the Application does not go
# Unhealthy, it goes ComparisonError — which nothing currently alerts on. If this
# is what ships, INFRA-1642's stale-source alert stops being hygiene and becomes
# a dependency of it.
#
# The token must belong to a machine user, not a person. A PAT tied to a leaver
# takes app delivery down on both clusters on their offboarding day.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-variant-inc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: argocd-repo-creds-variant-inc
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/variant-inc
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: op-usxpress-qa/platform/argocd
        property: repo.username
    - secretKey: password
      remoteRef:
        key: op-usxpress-qa/platform/argocd
        property: repo.password
