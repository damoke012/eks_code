---
# INFRA-1647 — the Git credential Argo CD reads private/internal variant-inc
# repositories with. Argo CD on op-usxpress-qa holds NO Git credential at all:
# no secret on this cluster carries the `argocd.argoproj.io/secret-type` label.
# `risingwave-pipeline` is INTERNAL, so every Application pointing at it fails
# with `ComparisonError: authentication required`.
#
# SCOPE: org-wide credential template, not per-repo. Argo CD matches a
# `repo-creds` secret to an Application by longest URL PREFIX, so this one secret
# covers every `https://github.com/variant-inc/*` repository — onboarding the
# next app needs no new credential. This deliberately mirrors the `apps`
# AppProject's `sourceRepos`, which already allows exactly that prefix.
#
# GitHub App variant. The installation token Argo CD mints from it is short-lived
# and auto-renewed, so there is no expiry date to forget — which is the failure
# that took the QA Flux GitRepository down silently for two days on 2026-08-16
# (INFRA-1642). The App's private key does not expire.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds-variant-inc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: argocd-repo-creds-variant-inc
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        # REQUIRED. Argo CD's repo-server only considers secrets carrying this
        # label; ESO does NOT copy labels from the ExternalSecret to the Secret
        # it creates, so the label has to be set here or the credential is
        # created correctly and ignored completely.
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        # No trailing slash and no `.git` — this is a PREFIX, matched against
        # the Application's repoURL.
        url: https://github.com/variant-inc
        githubAppID: "{{ .githubAppID }}"
        githubAppInstallationID: "{{ .githubAppInstallationID }}"
        githubAppPrivateKey: "{{ .githubAppPrivateKey }}"
  data:
    - secretKey: githubAppID
      remoteRef:
        key: op-usxpress-qa/platform/argocd
        property: repo.githubAppID
    - secretKey: githubAppInstallationID
      remoteRef:
        key: op-usxpress-qa/platform/argocd
        property: repo.githubAppInstallationID
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: op-usxpress-qa/platform/argocd
        property: repo.githubAppPrivateKey
