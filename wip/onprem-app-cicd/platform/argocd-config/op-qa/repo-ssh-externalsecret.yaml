---
# INFRA-1647 — DEPLOY KEY VARIANT. Use when the org App needs an owner you have
# to wait for, and a PAT is unacceptable because it is tied to a person.
#
# A deploy key belongs to the REPOSITORY, not to a user account. It survives
# offboarding, it does not expire, and creating one needs admin on that one repo
# rather than ownership of the org. That is the whole reason this file exists.
#
# The trade is scope. A deploy key is per-repository, so this is
# `secret-type: repository` with an EXACT url, not `repo-creds` with a prefix —
# onboarding the next application means another key and another file. The org
# App remains the target precisely because it collapses that back to one object.
#
# ⚠️ The ApplicationSet element must use the SSH URL to match:
#     repoURL: ssh://git@github.com/variant-inc/risingwave-pipeline.git
# An https:// Application will not match this secret and fails with
# `authentication required` — indistinguishable from having no credential.
#
# github.com's host key is already in the chart's argocd-ssh-known-hosts-cm, so
# no known-hosts change is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-risingwave-pipeline
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: argocd-repo-risingwave-pipeline
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        # `repository`, not `repo-creds`: this credential is bound to one exact
        # URL rather than serving every repo under a prefix.
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: ssh://git@github.com/variant-inc/risingwave-pipeline.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: op-usxpress-qa/platform/argocd
        property: repo.risingwave-pipeline.sshPrivateKey
