# Template — copy to app-<name>.yaml and replace APPNAME.
apiVersion: v1
kind: Namespace
metadata:
  name: app-APPNAME
  labels:
    istio.io/dataplane-mode: ambient
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/managed-by: flux
    platform.usxpress.io/owner: APPNAME
    platform.usxpress.io/delivery: argocd     # selected by the Kyverno policies
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-APPNAME-quota
  namespace: app-APPNAME
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: app-APPNAME-limits
  namespace: app-APPNAME
spec:
  limits:
    - type: Container
      default:        { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
