# Images in namespaces delivered by Argo CD must come from the shared ECR registry.
#
# Start in Audit. Flip to Enforce once the first app is deployed and the policy
# report is clean — there are zero app-* workloads today, so the window for
# adopting this cheaply is now.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-approved-registry
  annotations:
    policies.kyverno.io/title: Approved registry only
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/description: >-
      Workloads in namespaces delivered by Argo CD may only run images from the shared ECR
      registry (064859874041.dkr.ecr.us-east-2.amazonaws.com). Platform
      namespaces are unaffected — they run upstream charts by design.
spec:
  # Enforce as of 2026-08-20 (INFRA-1640). Held at Audit until a real application
  # deployed cleanly through the whole path, so the first thing these blocked
  # would be a mistake rather than the pipeline's own bring-up. That happened on
  # 2026-08-20: risingwave-etl built, pushed by digest, pulled cross-account and
  # ran its smoke payload (INFRA-1648). Both policies were observed firing in
  # Audit against a real tagged image before the flip.
  validationFailureAction: Enforce
  background: true
  rules:
    - name: ecr-only
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  # every app-* namespace the platform creates carries this label,
                  # so a new app is covered on the day it onboards - no policy edit
                  platform.usxpress.io/delivery: argocd
      validate:
        message: >-
          Images must come from 064859874041.dkr.ecr.us-east-2.amazonaws.com.
          Build in CI and push to ECR; do not reference upstream registries directly.
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "064859874041.dkr.ecr.us-east-2.amazonaws.com/*"
            =(initContainers):
              - image: "064859874041.dkr.ecr.us-east-2.amazonaws.com/*"
            containers:
              - image: "064859874041.dkr.ecr.us-east-2.amazonaws.com/*"
