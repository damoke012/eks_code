# Images in namespaces delivered by Argo CD must be referenced by digest, not tag.
#
# This is what makes "build once, promote the same artefact" real. A tag can be
# moved; a digest cannot. Without this, promotion is a convention that holds
# until someone is in a hurry.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Digest, not tag
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/description: >-
      Workloads in namespaces delivered by Argo CD must pin images by sha256 digest so that what
      runs in prod is provably the artefact that passed in QA.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: digest-required
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  # every app-* namespace the platform creates carries this label,
                  # so a new app is covered on the day it onboards - no policy edit
                  platform.usxpress.io/delivery: argocd
      validate:
        message: >-
          Images must be pinned by digest, e.g. repo@sha256:… — a tag can be moved,
          which breaks the promotion guarantee.
        pattern:
          spec:
            =(initContainers):
              - image: "*@sha256:*"
            containers:
              - image: "*@sha256:*"
