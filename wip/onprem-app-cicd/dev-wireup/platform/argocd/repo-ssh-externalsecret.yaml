---
# INFRA-1647 — DEPLOY KEY VARIANT, op-usxpress-dev. Mirrors op-qa and op-prod.
#
# A deploy key belongs to the REPOSITORY, not to a user account. It survives
# offboarding, it does not expire, and creating one needs admin on that one repo
# rather than ownership of the org.
#
# DEV HAS ITS OWN KEY, not a copy of QA's. Key id 165827187, title
# "op-usxpress-dev argocd", read-only, added 2026-10-08. Revoking dev therefore
# cannot take QA or prod down.
#
# ⚠️ The ApplicationSet element must use the SSH URL to match:
#     repoURL: ssh://git@github.com/variant-inc/risingwave-pipeline.git
# An https:// Application will not match this secret and fails with
# `authentication required` — indistinguishable from having no credential.
# PR #100 reverted exactly that line and delivery was down 18h, with
# sync=Unknown, health=Healthy and a stale Succeeded.
#
# github.com's host key is already in the chart's argocd-ssh-known-hosts-cm.
#
# PLACEMENT: op-dev keeps Argo's config inside infrastructure/argocd/ — it has
# not been split into argocd-config/ the way op-qa and op-prod have. This file
# goes beside admin-externalsecret.yaml and is added to that directory's
# kustomization.yaml. Converging dev onto the QA/prod layout is a separate
# change: moving a live ExternalSecret between two Kustomizations that both
# prune can delete and recreate it, and one of them backs the admin password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-risingwave-pipeline
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: argocd-repo-risingwave-pipeline
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        # `repository`, not `repo-creds`: bound to one exact URL rather than
        # serving every repo under a prefix.
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: ssh://git@github.com/variant-inc/risingwave-pipeline.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: op-usxpress-dev/platform/argocd
        property: repo.risingwave-pipeline.sshPrivateKey
