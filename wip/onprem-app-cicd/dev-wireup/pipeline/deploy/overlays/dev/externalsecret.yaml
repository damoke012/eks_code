# Complete ExternalSecret for op-usxpress-dev. Deliberately not a patch on base -- see
# base/kustomization.yaml for why positional patches were removed.
#
# ⚠️ CASING. Dev's properties are KAFKA__* (upper). QA's are kafka__* (lower). The same
# secret, two spellings, two accounts -- and a wrong spelling resolves to NOTHING with no
# error. Confirm against dev's own secret before merging:
#   aws secretsmanager get-secret-value --profile usx-dev \
#     --secret-id op-usxpress-dev/risingwave/kafka --query SecretString --output text \
#     | python3 -c 'import json,sys;[print(k,len(v)) for k,v in sorted(json.load(sys.stdin).items())]'
# That prints names and LENGTHS. Any length of 0 is a blocker -- an empty value reads as
# configured and fails far downstream.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-pipeline-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: etl-pipeline-credentials
    creationPolicy: Owner
  data:
    - secretKey: RW_PASSWORD
      remoteRef: { key: op-usxpress-dev/risingwave/root,     property: password }
    - secretKey: PG_PASSWORD
      remoteRef: { key: op-usxpress-dev/risingwave/postgres, property: password }
    - secretKey: PG_USER
      remoteRef: { key: op-usxpress-dev/risingwave/postgres, property: username }

    - secretKey: KAFKA_API_KEY
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__api_key }
    - secretKey: KAFKA_API_SECRET
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__api_secret }
    - secretKey: KAFKA_BOOTSTRAP_SERVER
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__bootstrap_server }
    - secretKey: KAFKA_RESOURCE_ID
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__resource_id }
    - secretKey: KAFKA_REST_ENDPOINT
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__rest_endpoint }
    - secretKey: KAFKA_SERVICE_ACCOUNT
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__service_account }

    # Dev's registry three were POPULATED on 2026-09-11 (endpoint 48 chars) -- QA's were
    # empty, which is why QA borrowed dev's. Re-confirm with the length probe above anyway.
    - secretKey: KAFKA_SCHEMA_REGISTRY_API_KEY
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__schema_registry_api_key }
    - secretKey: KAFKA_SCHEMA_REGISTRY_API_SECRET
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__schema_registry_api_secret }
    - secretKey: KAFKA_SCHEMA_REGISTRY_ENDPOINT
      remoteRef: { key: op-usxpress-dev/risingwave/kafka, property: KAFKA__schema_registry_endpoint }
