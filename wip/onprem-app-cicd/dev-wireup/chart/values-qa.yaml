# op-usxpress-qa - derived from deploy/overlays/qa 2026-10-09.
#
# Weaker provenance than values-dev.yaml, which was generated from the LIVE
# ConfigMap and ExternalSecret on op-dev. op-qa was unreachable when this was
# written, so it comes from the git overlay instead.
#
# BEFORE FLIPPING QA: diff this render against the live etl-pipeline-endpoints
# and etl-pipeline-credentials in app-risingwave on op-qa. The overlay can be
# stale - QA has run with values that did not match its own overlay before.
#
# OPEN: the overlay says qa_brand_management_cdc_brand_avro, but a 2026-10-08
# note records QA's LIVE ConfigMap deliberately reading DEV's topic while QA
# waited for its own. If live disagrees, live wins - changing QA's topic is a
# separate change that needs Tim, not a side effect of a delivery flip.
#
# Three lines differ from values-dev.yaml: environment, digest, topic.
# APPLIED_BY and all three Secrets Manager paths are GENERATED from
# `environment`, which is what removes the copy-paste risk that left prod's
# overlay pointing at PLACEHOLDER.
environment: qa

image:
  # QA's own digest, from deploy/overlays/qa. Differs from dev's - do not
  # assume the two environments run the same image.
  digest: sha256:461772e87492526637865b2834717e7590a443fb2440b46c3749456c08e2e2fe

config:
  PIPELINE_DIR: /pipeline/pipelines
  # Single-quoted so the \. stays literal; helm's `quote` escapes it correctly
  # into the ConfigMap. QA's overlay value, which happens to equal dev's.
  EXCLUDE_RE: '(^|/)(Template|employee|secret_manager|shared)(/|$)|^pipelines/Brand/(300-transform\.sql|400-sink\.rw)$'

  RW_HOST: risingwave-frontend.risingwave.svc.cluster.local
  RW_PORT: "4567"
  RW_DB:   dev
  RW_USER: root

  PG_HOST: pg-postgresql.risingwave.svc.cluster.local
  PG_PORT: "5432"
  PG_DB:   risingwave

  # Empty in QA's overlay. apply.sh validates EVERY runtime value before
  # applying EXCLUDE_RE, so these must be present-and-empty exactly as they
  # are, not omitted and not filled in.
  POSTGRES_SERVER:     ""
  POSTGRES_ENTITY_DB:  ""
  POSTGRES_PORT:       "5432"

  KAFKA_TOPIC_BRAND: qa_brand_management_cdc_brand_avro
  KAFKA_STARTUP_MODE: earliest
  # The real Avro subject, live since PR #73. Never set this blank.
  KAFKA_SCHEMA_REGISTRY_MESSAGE: USXpress.Standard.Types.Brand.V1.company_master

# Three entries. op-usxpress-qa/... is built by etl.prefix from `environment`,
# so these paths cannot be copied wrong between environments.
externalSecret:
  refreshInterval: 1h
  secretStore: default
  data:
    - secretKey: RW_PASSWORD
      path: risingwave/root
      property: password
    - secretKey: PG_PASSWORD
      path: risingwave/postgres
      property: password
    - secretKey: PG_USER
      path: risingwave/postgres
      property: username
