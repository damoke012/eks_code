# op-usxpress-qa - derived from deploy/overlays/qa 2026-10-09.
#
# WEAKER PROVENANCE THAN values-dev.yaml. values-dev was generated from the LIVE
# ConfigMap and ExternalSecret on op-dev. This file was derived from the git
# overlay, because op-qa was unreachable when it was written (both on-prem
# control planes timed out at the TCP level - VPN, not a cluster fault).
#
# BEFORE FLIPPING QA: dump the live etl-pipeline-endpoints and
# etl-pipeline-credentials in app-risingwave on op-qa and diff this render
# against them. The overlay can be stale - QA has previously run with values
# that did not match its own overlay.
#
# ONE OPEN QUESTION: the overlay says qa_brand_management_cdc_brand_avro, but a
# note from 2026-10-08 records QA's LIVE ConfigMap deliberately reading DEV's
# topic while QA waited for its own. If live disagrees, live wins and changing
# QA's topic is a separate change that needs Tim, not a side effect of the flip.
#
# Only three lines differ from values-dev.yaml: environment, digest, and the
# topic. APPLIED_BY and all three Secrets Manager paths are GENERATED by the
# chart from `environment`, which is what removes the copy-paste risk that left
# prod's overlay pointing at PLACEHOLDER.
environment: qa

image:
  # The digest dev is running right now, read from ConfigMap etl-pipeline-image.
  digest: sha256:461772e87492526637865b2834717e7590a443fb2440b46c3749456c08e2e2fe

config:
  PIPELINE_DIR: /pipeline/pipelines
  # Single-quoted so the \. stays literal; helm's `quote` escapes it correctly
  # into the ConfigMap. This is dev's LIVE value, character for character.
  EXCLUDE_RE: '(^|/)(Template|employee|secret_manager|shared)(/|$)|^pipelines/Brand/(300-transform\.sql|400-sink\.rw)$'

  RW_HOST: risingwave-frontend.risingwave.svc.cluster.local
  RW_PORT: "4567"
  RW_DB:   dev
  RW_USER: root

  PG_HOST: pg-postgresql.risingwave.svc.cluster.local
  PG_PORT: "5432"
  PG_DB:   risingwave

  # Empty in live. apply.sh validates EVERY runtime value before applying
  # EXCLUDE_RE, so these must be present-and-empty exactly as they are, not
  # omitted and not filled in.
  POSTGRES_SERVER:     ""
  POSTGRES_ENTITY_DB:  ""
  POSTGRES_PORT:       "5432"

  KAFKA_TOPIC_BRAND: qa_brand_management_cdc_brand_avro
  KAFKA_STARTUP_MODE: earliest
  # The real Avro subject, live since PR #73. Never set this blank.
  KAFKA_SCHEMA_REGISTRY_MESSAGE: USXpress.Standard.Types.Brand.V1.company_master

# Three entries, matching live exactly. op-usxpress-dev/... is built by
# etl.prefix from `environment`.
externalSecret:
  refreshInterval: 1h
  secretStore: default
  data:
    - secretKey: RW_PASSWORD
      path: risingwave/root
      property: password
    - secretKey: PG_PASSWORD
      path: risingwave/postgres
      property: password
    - secretKey: PG_USER
      path: risingwave/postgres
      property: username
