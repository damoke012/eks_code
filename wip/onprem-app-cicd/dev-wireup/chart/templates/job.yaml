# Applies the pipeline SQL from inside the cluster. RisingWave's frontend is a
# ClusterIP service with no external route, so the work happens in-cluster.
#
# Run by Argo CD as a Sync hook so it re-runs on every sync and its logs land
# in the Argo UI, where the RisingWave team watch their deploys.
#
# ⚠️ On FINAL failure Argo removes the hook Job entirely, taking the pod and
# its logs with it. To read a failure, reproduce it as a plain Job with a
# different name rather than re-syncing.
apiVersion: batch/v1
kind: Job
metadata:
  name: etl-pipeline-apply
  labels: {{- include "etl.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "etl.labels" . | nindent 8 }}
        app.kubernetes.io/component: apply
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      containers:
        - name: apply
          image: {{ .Values.image.repository }}@{{ .Values.image.digest }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          # Both consumed wholesale. Enumerating keys here would mean this list
          # and the ExternalSecret had to be kept in step by hand - the same
          # keep-two-lists-aligned coupling that left prod's PG_USER pointing at
          # PLACEHOLDER. Both resolve at POD CREATION; this Job is created fresh
          # on every sync, so it always reads current values.
          envFrom:
            - configMapRef:
                name: etl-pipeline-endpoints
            - secretRef:
                name: etl-pipeline-credentials
