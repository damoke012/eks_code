# Applies the pipeline SQL from inside the cluster.
#
# RisingWave's frontend is a ClusterIP service with no external route, so the
# work has to happen in-cluster. Run by Argo CD as a Sync hook so it re-runs on
# every sync and its logs land in the Argo UI, where the RisingWave team watch
# their deploys.
#
# apply.sh is idempotent: a re-sync with no SQL change is a no-op.
#
# ⚠️ On FINAL failure Argo removes the hook Job entirely, taking the pod and its
# logs with it. To read a failure, re-run the same digest as a plain Job under a
# different name - and pin the digest, because Kyverno on these clusters refuses
# both an unapproved registry and an unpinned tag at admission.
apiVersion: batch/v1
kind: Job
metadata:
  name: etl-pipeline-apply
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etl-pipeline-apply
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}   # written by ecr-credentials-sync every 5 min
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apply
          image: {{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities: { drop: ["ALL"] }
          {{- if .Values.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp              # apply.sh renders each file through mktemp
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: etl-pipeline-endpoints    # per-cluster coordinates
          env:
            # GENERATED from externalSecret.data, so this list and the
            # ExternalSecret cannot drift apart. The base manifest kept two
            # hand-maintained lists; that is the same keep-two-lists-aligned
            # coupling that left prod's PG_USER pointing at PLACEHOLDER.
            {{- range .Values.externalSecret.data }}
            - name: {{ .secretKey }}
              valueFrom:
                secretKeyRef: { name: etl-pipeline-credentials, key: {{ .secretKey }} }
            {{- end }}
            {{- if .Values.readOnlyRootFilesystem }}
            - name: TMPDIR
              value: /tmp
            {{- end }}
      {{- if .Values.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}                     # the root filesystem stays read-only
      {{- end }}
