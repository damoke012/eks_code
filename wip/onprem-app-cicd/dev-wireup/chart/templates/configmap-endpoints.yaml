{{- if not .Values.config }}
{{- fail "config is empty: apply.sh consumes it wholesale and would start with no coordinates" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-pipeline-endpoints
  namespace: {{ .Release.Namespace }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  APPLIED_BY: argocd-{{ include "etl.env" . }}
