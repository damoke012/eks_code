{{- /*
  A value marked UNVERIFIED_ is deliberately not a real value. It exists so a
  smoke run can satisfy apply.sh, which validates EVERY runtime value before it
  applies EXCLUDE_RE - a blank fails the whole run, so the key must be present.

  The moment PIPELINE_DIR stops pointing at smoke, those markers MUST have been
  replaced. This refuses to render rather than let a plausible-looking wrong
  value reach RisingWave and fail at Avro decode time, which is how an earlier
  placeholder survived into QA.
*/}}
{{- if not (contains "smoke" .Values.config.PIPELINE_DIR) }}
  {{- range $k, $v := .Values.config }}
    {{- if hasPrefix "UNVERIFIED_" ($v | toString) }}
      {{- fail (printf "config.%s is still %s but PIPELINE_DIR is %s - replace the marker with the real value before running the pipelines" $k $v $.Values.config.PIPELINE_DIR) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if not .Values.config }}
{{- fail "config is empty: apply.sh consumes it wholesale and would start with no coordinates" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-pipeline-endpoints
  namespace: {{ .Release.Namespace }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  APPLIED_BY: argocd-{{ include "etl.env" . }}
