apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-pipeline-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: etl-pipeline-credentials
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        # Keyed by NAME, never by list position.
        key: {{ include "etl.prefix" $ }}/{{ .path }}
        property: {{ .property }}
    {{- end }}
