# Build the application image and push it to the shared ECR by digest, then open
# the QA promotion PR.
#
# Generic: set the four values under `env` and the role ARN. Runs on a
# GitHub-hosted runner — building needs no cluster access, so nothing here touches
# on-prem.
name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/overlays/**'      # don't rebuild on a promotion PR merge
      - '**/*.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 064859874041.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: CHANGEME/app-name           # e.g. risingwave/etl-pipeline
  PUSH_ROLE: arn:aws:iam::064859874041:role/gha-CHANGEME-ecr-push
  DOCKERFILE: build/Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          provenance: false

      - run: |
          echo "Pushed ${ECR_REGISTRY}/${ECR_REPOSITORY}@${{ steps.push.outputs.digest }}"
          echo "This digest is what QA and then prod will run. Nothing is rebuilt."

  promote-to-qa:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump the QA overlay
        run: |
          set -euo pipefail
          f=deploy/overlays/qa/kustomization.yaml
          sed -i "s|digest: sha256:.*|digest: ${{ needs.build.outputs.digest }}|" "$f"
          git diff --exit-code "$f" && { echo "digest unchanged — nothing to promote"; exit 0; }

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: promote/qa-${{ github.sha }}
          title: "promote: QA -> ${{ github.sha }}"
          commit-message: "promote: QA to ${{ needs.build.outputs.digest }}"
          body: |
            Built from `${{ github.sha }}` · digest `${{ needs.build.outputs.digest }}`.

            Merging this makes Argo CD apply that digest on **op-usxpress-qa**.
            Prod is a separate PR against the prod overlay using the **same** digest —
            nothing is rebuilt between environments.
