{{- if .Values.appSecret.enabled }}
# A SECOND identity for secrets the application team owns.
#
# The platform's ClusterSecretStore `default` authenticates as
# external-secrets/external-secrets -- one cluster-wide identity that can read
# every secret in the account. Reusing it for the application's own secrets
# would mean "separate" was a naming convention and nothing more.
#
# This SecretStore is namespaced to app-risingwave and assumes a role scoped to
# <prefix>/risingwave/app* only. The platform role cannot read it and it cannot
# read the platform's. That is the whole point; the file layout is incidental.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rw-app-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "appSecret.roleArn is required when appSecret.enabled" .Values.appSecret.roleArn | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.appSecret.secretStore }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.appSecret.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: rw-app-secrets
{{- end }}
