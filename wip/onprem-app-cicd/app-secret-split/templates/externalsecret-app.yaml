{{- if .Values.appSecret.enabled }}
# The application team's own secrets.
#
# NOTE the absence of a key list. The platform ExternalSecret enumerates its
# keys because we own them and they must not change without a review. This one
# uses dataFrom.extract, which pulls EVERY key in the named AWS secret into the
# Kubernetes Secret -- so the pipeline author adds a key in Secrets Manager and
# it reaches their SQL with no pull request in this repo, ever.
#
# That is deliberate, and it is the only way the ownership split is real: a key
# list here would put the application's variable NAMES back in the platform's
# repo, which is the co-mingling this change exists to remove.
#
# These land in the pod via `envFrom`, while the platform's land via explicit
# `env:` entries. Kubernetes resolves an explicit env over any envFrom, so an
# application key can never shadow a platform credential or coordinate, whatever
# it is called.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-app-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.appSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.appSecret.secretStore }}
    kind: SecretStore
  target:
    name: etl-app-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ include "etl.prefix" $ }}/{{ .Values.appSecret.path }}
{{- end }}
