# Applies the pipeline SQL from inside the cluster.
#
# RisingWave's frontend is a ClusterIP service with no external route, so the work has to
# happen in-cluster. On dev that is the ARC runner; here it is this Job, run by Argo CD as
# a Sync hook so it re-runs on every sync and its logs land in the Argo UI — which is where
# the RisingWave team watch their deploys.
#
# apply.sh is idempotent: a re-sync with no SQL change is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: etl-pipeline-apply
  annotations:
    argocd.argoproj.io/hook: Sync
    # HookSucceeded, not BeforeHookCreation: a FAILED hook Job must survive so its
    # pod and logs can be read. BeforeHookCreation deletes the failed Job at the
    # start of the next retry, so on a backoff of minutes the evidence is gone
    # every time you look — which is exactly when you need it. Successful runs are
    # still cleaned up automatically.
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etl-pipeline-apply
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-pull-secret          # written by ecr-credentials-sync every 5 min
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apply
          image: etl-pipeline            # overlays pin the digest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          envFrom:
            - configMapRef:
                name: etl-pipeline-endpoints    # per-cluster coordinates
          env:
            - name: RW_PASSWORD
              valueFrom:
                secretKeyRef: { name: etl-pipeline-credentials, key: RW_PASSWORD }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: etl-pipeline-credentials, key: PG_PASSWORD }
