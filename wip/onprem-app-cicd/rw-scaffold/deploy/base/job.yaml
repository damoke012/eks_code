# Applies the pipeline SQL from inside the cluster.
#
# RisingWave's frontend is a ClusterIP service with no external route, so the work has to
# happen in-cluster. On dev that is the ARC runner; here it is this Job, run by Argo CD as
# a Sync hook so it re-runs on every sync and its logs land in the Argo UI — which is where
# the RisingWave team watch their deploys.
#
# apply.sh is idempotent: a re-sync with no SQL change is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: etl-pipeline-apply
  annotations:
    argocd.argoproj.io/hook: Sync
    # BOTH policies, and the pairing is the point (INFRA-1653):
    #   HookSucceeded       — a successful run cleans itself up.
    #   BeforeHookCreation  — a FAILED Job survives until the NEXT deliberate sync,
    #                         then is removed so it cannot block the new one with
    #                         AlreadyExists.
    # HookSucceeded alone was tried on 2026-08-20 and is wrong in both directions:
    # it deletes the evidence of success, and a retained failure blocks the next
    # sync. BeforeHookCreation alone loses the evidence of failure, because Argo
    # CD's automatic retries recreate the hook. The retry limit on the
    # ApplicationSet is the other half of this fix.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etl-pipeline-apply
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-pull-secret          # written by ecr-credentials-sync every 5 min
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apply
          image: etl-pipeline            # overlays pin the digest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          envFrom:
            - configMapRef:
                name: etl-pipeline-endpoints    # per-cluster coordinates
          env:
            - name: RW_PASSWORD
              valueFrom:
                secretKeyRef: { name: etl-pipeline-credentials, key: RW_PASSWORD }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: etl-pipeline-credentials, key: PG_PASSWORD }
            # `env` overrides `envFrom`, so this wins over any PG_USER left in the
            # endpoints ConfigMap. Username and password travel together or not
            # at all.
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: etl-pipeline-credentials, key: PG_USER }
