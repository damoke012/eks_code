# Credentials come from AWS Secrets Manager via External Secrets, the same path every other
# secret on these clusters uses. Nothing sensitive is in git and nothing sensitive is in the
# image. The Secrets Manager paths differ per cluster; the overlays set them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-pipeline-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: etl-pipeline-credentials
    creationPolicy: Owner
  data:
    - secretKey: RW_PASSWORD
      remoteRef:
        key: PLACEHOLDER/risingwave/root
        property: password
    - secretKey: PG_PASSWORD
      remoteRef:
        key: PLACEHOLDER/risingwave/postgres
        property: password
    # The username comes from the SAME secret as the password it belongs with.
    # Splitting them — username in a ConfigMap, password here — let the overlay
    # assert PG_USER=postgres while the secret held `risingwave`, which fails as
    # `password authentication failed for user "postgres"`: a credential error
    # that names the wrong cause.
    - secretKey: PG_USER
      remoteRef:
        key: PLACEHOLDER/risingwave/postgres
        property: username
