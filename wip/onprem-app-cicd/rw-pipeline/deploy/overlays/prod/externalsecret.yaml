# Complete ExternalSecret for op-usxpress-prod. Deliberately not a patch on base -- see
# base/kustomization.yaml.
#
# All nine KAFKA__* values come from Secrets Manager rather than the ConfigMap, including
# the non-secret ones (bootstrap server, endpoints, resource id). They already live there
# per environment, so this keeps one source of truth instead of splitting the same
# connector's settings across two objects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-pipeline-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: etl-pipeline-credentials
    creationPolicy: Owner
  data:
    - secretKey: RW_PASSWORD
      remoteRef: { key: op-usxpress-prod/risingwave/root,     property: password }
    - secretKey: PG_PASSWORD
      remoteRef: { key: op-usxpress-prod/risingwave/postgres, property: password }
    - secretKey: PG_USER
      remoteRef: { key: op-usxpress-prod/risingwave/postgres, property: username }

    - secretKey: KAFKA_API_KEY
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__api_key }
    - secretKey: KAFKA_API_SECRET
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__api_secret }
    - secretKey: KAFKA_BOOTSTRAP_SERVER
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__bootstrap_server }
    - secretKey: KAFKA_RESOURCE_ID
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__resource_id }
    - secretKey: KAFKA_REST_ENDPOINT
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__rest_endpoint }
    - secretKey: KAFKA_SERVICE_ACCOUNT
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__service_account }

    # ⚠️ NOTHING under op-usxpress-prod/risingwave/ has been verified to exist. QA's kafka
    # secret was missing 3 of 9 keys when checked on 2026-08-26; prod has not been checked
    # at all. Verify every path here before wiring prod -- prod currently has no
    # ApplicationSet, so nothing renders this yet.
    - secretKey: KAFKA_SCHEMA_REGISTRY_API_KEY
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__schema_registry_api_key }
    - secretKey: KAFKA_SCHEMA_REGISTRY_API_SECRET
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__schema_registry_api_secret }
    - secretKey: KAFKA_SCHEMA_REGISTRY_ENDPOINT
      remoteRef: { key: op-usxpress-prod/risingwave/kafka, property: KAFKA__schema_registry_endpoint }
