# Complete ExternalSecret for op-usxpress-qa. Deliberately not a patch on base -- see
# base/kustomization.yaml.
#
# All nine KAFKA__* values come from Secrets Manager rather than the ConfigMap, including
# the non-secret ones (bootstrap server, endpoints, resource id). They already live there
# per environment, so this keeps one source of truth instead of splitting the same
# connector's settings across two objects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-pipeline-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    name: etl-pipeline-credentials
    creationPolicy: Owner
  data:
    - secretKey: RW_PASSWORD
      remoteRef: { key: op-usxpress-qa/risingwave/root,     property: password }
    - secretKey: PG_PASSWORD
      remoteRef: { key: op-usxpress-qa/risingwave/postgres, property: password }
    - secretKey: PG_USER
      remoteRef: { key: op-usxpress-qa/risingwave/postgres, property: username }

    - secretKey: KAFKA_API_KEY
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__api_key }
    - secretKey: KAFKA_API_SECRET
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__api_secret }
    - secretKey: KAFKA_BOOTSTRAP_SERVER
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__bootstrap_server }
    - secretKey: KAFKA_RESOURCE_ID
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__resource_id }
    - secretKey: KAFKA_REST_ENDPOINT
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__rest_endpoint }
    - secretKey: KAFKA_SERVICE_ACCOUNT
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__service_account }

    # ⚠️ These three were ABSENT from op-usxpress-qa/risingwave/kafka on 2026-08-26 (it had
    # 6 of dev's 9 keys). Brand's source is FORMAT PLAIN ENCODE AVRO, so without them it
    # cannot decode a message. Add them with scripts/qa-kafka-secret-sync.sh --write
    # BEFORE the first sync, or ESO reports SecretSynced with the keys simply missing.
    - secretKey: KAFKA_SCHEMA_REGISTRY_API_KEY
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__schema_registry_api_key }
    - secretKey: KAFKA_SCHEMA_REGISTRY_API_SECRET
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__schema_registry_api_secret }
    - secretKey: KAFKA_SCHEMA_REGISTRY_ENDPOINT
      remoteRef: { key: op-usxpress-qa/risingwave/kafka, property: KAFKA__schema_registry_endpoint }
