---
# Client kubeconfig for on-prem QA via AWS SSO. Save as ~/.kube/op-usxpress-qa-sso.yaml.
#
# Nothing in this file is secret — no key, no cert, no token. It can be sent in a message
# or committed to an internal wiki. Credentials are fetched at call time by the exec
# plugin from the caller's own SSO session.
#
# This is the one step EKS does for you (`aws eks update-kubeconfig`) that we do by hand.
# Everything after it is identical to the cloud experience.
#
# certificate-authority-data: the CLUSTER CA (public). Take it from the tfstate-derived
# admin kubeconfig:
#   kubectl --kubeconfig=$HOME/.kube/op-usxpress-qa.yaml config view --raw --minify \
#     -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
#
# ⚠️ Use $HOME, never `~`, inside --kubeconfig=. Bash does not tilde-expand after `=`
# in a command argument, so kubectl silently reads a nonexistent file and returns an
# EMPTY config instead of an error. Symptoms: `clusters: null` from `config view`, or
# `current-context must exist in order to minify`, or a zero-length CA that then fails
# as `x509: certificate signed by unknown authority`. Cost an hour on 2026-08-03 and
# produced a false "the file is corrupt" diagnosis. Always echo ${#CA} before using it.
#
# Do NOT paste a large heredoc into WSL to build this file — build it with
# `kubectl config set-cluster/set-credentials/set-context`, which is paste-safe:
#   kubectl --kubeconfig="$K" config set-cluster op-usxpress-qa \
#     --server=https://10.10.82.51:6443 --certificate-authority=/tmp/ca.crt --embed-certs=true
#   kubectl --kubeconfig="$K" config set-credentials sso \
#     --exec-api-version=client.authentication.k8s.io/v1beta1 \
#     --exec-command=aws-iam-authenticator \
#     --exec-arg=token --exec-arg=-i --exec-arg=op-usxpress-qa \
#     --exec-env=AWS_PROFILE=op-qa
#   kubectl --kubeconfig="$K" config set-context op-usxpress-qa-sso \
#     --cluster=op-usxpress-qa --user=sso
#   kubectl --kubeconfig="$K" config use-context op-usxpress-qa-sso
apiVersion: v1
kind: Config
clusters:
  - name: op-usxpress-qa
    cluster:
      server: https://10.10.82.51:6443 # QA. Dev is .50 — one digit apart, read it twice.
      certificate-authority-data: <FILL_CLUSTER_CA_BASE64>
contexts:
  - name: op-usxpress-qa-sso
    context:
      cluster: op-usxpress-qa
      user: sso
current-context: op-usxpress-qa-sso
users:
  - name: sso
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws-iam-authenticator
        args:
          - token
          # MUST match the server's --cluster-id. This is the anti-replay binding: a
          # token minted for one cluster is rejected by another.
          - -i
          - op-usxpress-qa
        env:
          # Which SSO session to use. Without this the plugin picks up whatever
          # AWS_PROFILE happens to be exported — which on this laptop has been prod.
          #
          # MUST be op-qa, NOT usx-qa. Verified 2026-08-03: usx-qa already exists
          # team-wide as the cloud EKS QA profile and assumes AWSAdministratorAccess,
          # which is not the mapped role. `aws sso login` then succeeds, sts looks
          # fine, and the cluster returns Unauthorized — reads as a broken mapping.
          - name: AWS_PROFILE
            value: op-qa
        # Prompts an SSO re-login on expiry instead of failing with an opaque error.
        interactiveMode: IfAvailable
        provideClusterInfo: false
