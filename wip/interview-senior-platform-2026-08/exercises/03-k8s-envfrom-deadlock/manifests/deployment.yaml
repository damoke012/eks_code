# Applied by the platform. Reference copy only — the live object is in the
# cluster and may differ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missions-api
  namespace: missions
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: missions-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: missions-api
    spec:
      containers:
        - name: missions-api
          image: nginx:1.27-alpine
          envFrom:
            - configMapRef:
                name: missions-api-chart
            - configMapRef:
                name: missions-api-m-u
          ports:
            - containerPort: 80
