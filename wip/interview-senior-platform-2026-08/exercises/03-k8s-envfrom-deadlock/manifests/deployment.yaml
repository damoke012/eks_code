# Applied by the platform. Reference copy only — the live object is in the
# cluster and may differ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbx-missions-api
  namespace: sbx-missions
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sbx-missions-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sbx-missions-api
    spec:
      containers:
        - name: sbx-missions-api
          image: nginx:1.27-alpine
          envFrom:
            - configMapRef:
                name: sbx-missions-api-chart
            - configMapRef:
                name: sbx-missions-api-m-u
          ports:
            - containerPort: 80
