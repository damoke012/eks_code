# ENVIRONMENT: all three on-prem clusters. Zero-risk: alerting rules only, no behaviour change.
# Place in the platform repo's monitoring directory on each op-<env> branch.
# The label `release: prometheus-stack` is what makes Prometheus adopt it -- without it the
# rule lands, reports healthy and is never evaluated.
#
# PREREQUISITE, verify before trusting this: Prometheus must be scraping cert-manager.
#   kubectl -n cert-manager get svc -l app.kubernetes.io/name=cert-manager
#   curl -s http://<cert-manager-svc>:9402/metrics | grep certmanager_certificate_expiration
# If certmanager_certificate_expiration_timestamp_seconds is absent, these rules are inert
# and will never fire -- which looks exactly like "no certificates are expiring".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificate-expiry
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: certificates
      rules:
        # The one that would have caught 2026-10-06 six weeks earlier.
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | printf \"%.0f\" }} days"
            description: "cert-manager reports Ready:True on an expired certificate, so Ready is not evidence. Check .status.notAfter."

        - alert: CertificateExpired
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 0
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.name }} in {{ $labels.namespace }} EXPIRED -- browsers are refusing it now"

        # Catches the renewal failure directly, weeks before the expiry does.
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.name }} in {{ $labels.namespace }} is not Ready"

        # cert-manager with no credentials is the root cause we hit. This sees it on day one
        # instead of at the first missed renewal, 50+ days later.
        - alert: CertManagerACMEFailing
          expr: increase(certmanager_http_acme_client_request_count{status!~"2.."}[1h]) > 5
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "cert-manager ACME requests failing -- renewals will silently stop"

        # An Order sitting pending for a day is a dead order URL or a broken solver.
        # Both present as "nothing is happening", which no other rule covers.
        - alert: CertManagerOrderStuck
          expr: time() - certmanager_certificate_expiration_timestamp_seconds > 0 and on(namespace, name) certmanager_certificate_ready_status{condition="False"} == 1
          for: 24h
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.name }} has been expired and not-Ready for 24h -- issuance is stuck, not slow"
